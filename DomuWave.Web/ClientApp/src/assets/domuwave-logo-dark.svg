<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 44" fill="none" role="img" aria-label="DomuWave">
  <!-- Marchio: due edifici stilizzati con finestre (identità DomuWave) -->
  <g>
    <rect x="2"  y="15" width="15" height="25" rx="2.5" fill="#2e9c6c"/>
    <rect x="21" y="6"  width="15" height="34" rx="2.5" fill="#c9a55c"/>
    <!-- finestre edificio smeraldo -->
    <rect x="6.5" y="20" width="6" height="3" rx="1" fill="#ffffff" opacity="0.9"/>
    <rect x="6.5" y="27" width="6" height="3" rx="1" fill="#ffffff" opacity="0.9"/>
    <rect x="6.5" y="34" width="6" height="3" rx="1" fill="#ffffff" opacity="0.9"/>
    <!-- finestre edificio ottone -->
    <rect x="25.5" y="12" width="6" height="3" rx="1" fill="#0c1f17" opacity="0.45"/>
    <rect x="25.5" y="19" width="6" height="3" rx="1" fill="#0c1f17" opacity="0.45"/>
    <rect x="25.5" y="26" width="6" height="3" rx="1" fill="#0c1f17" opacity="0.45"/>
    <rect x="25.5" y="33" width="6" height="3" rx="1" fill="#0c1f17" opacity="0.45"/>
  </g>

  <!-- Wordmark: "Domu" scuro + "Wave" smeraldo (per fondi chiari) -->
  <text x="48" y="30"
        font-family="'Outfit','Segoe UI',system-ui,sans-serif"
        font-size="22" font-weight="600" letter-spacing="-0.5">
    <tspan fill="#14201a">Domu</tspan><tspan fill="#2e9c6c">Wave</tspan>
  </text>
</svg>
