<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ER Diagram – GestionaleCondominio</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #1a1d2e; color: #e0e6f0; min-height: 100vh; }

  header {
    padding: 16px 24px;
    background: #12152a;
    border-bottom: 2px solid #2d3561;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  header h1 { font-size: 1.2rem; color: #7eb8f7; letter-spacing: 1px; }
  header span { font-size: 0.8rem; color: #8899bb; }

  .controls {
    display: flex; gap: 10px; align-items: center;
  }
  .controls button {
    background: #2d3561; border: 1px solid #4a5580; color: #c0d0f0;
    border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 0.82rem;
    transition: background 0.2s;
  }
  .controls button:hover { background: #3d4880; }

  .legend {
    display: flex; gap: 18px; flex-wrap: wrap; padding: 10px 24px;
    background: #181b2e; border-bottom: 1px solid #252a45;
    align-items: center; font-size: 0.78rem;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-color { width: 14px; height: 14px; border-radius: 3px; }

  #canvas-wrap {
    overflow: auto; width: 100%; height: calc(100vh - 110px);
    cursor: grab;
  }
  #canvas-wrap:active { cursor: grabbing; }

  svg { display: block; }

  /* Table styles */
  .table-group { cursor: pointer; }
  .table-header { font-weight: 700; font-size: 11.5px; fill: #fff; }
  .table-pk { font-size: 10px; fill: #ffd166; font-weight: 600; }
  .table-fk { font-size: 10px; fill: #a8d8ea; }
  .table-col { font-size: 10px; fill: #ccd6f6; }
  .table-type { font-size: 9px; fill: #8899bb; }

  .header-core { fill: #1e3a5f; }
  .header-property { fill: #1e4a3a; }
  .header-finance { fill: #4a2a1e; }
  .header-comms { fill: #3a1e4a; }
  .header-docs { fill: #3a3a1e; }
  .header-suppliers { fill: #2a3a1e; }
  .header-millesimi { fill: #1e2a4a; }

  .body-core { fill: #0d2040; }
  .body-property { fill: #0d2a1e; }
  .body-finance { fill: #2a1408; }
  .body-comms { fill: #1e0d2a; }
  .body-docs { fill: #1e1e08; }
  .body-suppliers { fill: #101e08; }
  .body-millesimi { fill: #0d152a; }

  .table-border { stroke-width: 1.5; fill: none; rx: 6; }
  .border-core { stroke: #3a7fd4; }
  .border-property { stroke: #3ab87a; }
  .border-finance { stroke: #e0713a; }
  .border-comms { stroke: #a03adc; }
  .border-docs { stroke: #c4c422; }
  .border-suppliers { stroke: #5ab83a; }
  .border-millesimi { stroke: #3a6ac4; }

  .row-sep { stroke: #ffffff18; stroke-width: 0.5; }

  /* FK lines */
  .fk-line { fill: none; stroke-width: 1.4; opacity: 0.7; }
  .fk-line:hover { opacity: 1; stroke-width: 2.2; }

  .tooltip {
    position: fixed; background: #0d1226; border: 1px solid #3a5090;
    padding: 8px 12px; border-radius: 6px; font-size: 0.78rem;
    pointer-events: none; display: none; z-index: 999; color: #c8d8f8;
    max-width: 280px; line-height: 1.5;
  }
</style>
</head>
<body>
<header>
  <h1>📊 ER Diagram — GestionaleCondominio</h1>

<div class="tooltip" id="tooltip"></div>

<script>
const wrap = document.getElementById('canvas-wrap');
const svg = document.getElementById('main-svg');
let scale = 1, tx = 0, ty = 0;
let dragging = false, sx = 0, sy = 0;

function applyTransform() {
  svg.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  svg.style.transformOrigin = '0 0';
}

function zoom(factor) {
  const cx = wrap.offsetWidth / 2;
  const cy = wrap.offsetHeight / 2;
  tx = cx - factor * (cx - tx);
  ty = cy - factor * (cy - ty);
  scale *= factor;
  applyTransform();
}

function resetView() {
  scale = 0.58; tx = 10; ty = 10;
  applyTransform();
}

wrap.addEventListener('mousedown', e => {
  dragging = true; sx = e.clientX - tx; sy = e.clientY - ty;
  wrap.style.cursor = 'grabbing';
});
wrap.addEventListener('mousemove', e => {
  if (!dragging) return;
  tx = e.clientX - sx; ty = e.clientY - sy;
  applyTransform();
});
wrap.addEventListener('mouseup', () => { dragging = false; wrap.style.cursor = 'grab'; });
wrap.addEventListener('mouseleave', () => { dragging = false; });
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.1 : 0.9;
  const rect = wrap.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  tx = mx - f * (mx - tx);
  ty = my - f * (my - ty);
  scale *= f;
  applyTransform();
}, { passive: false });

// Initial zoom
resetView();

// Table descriptions
const desc = {
  'tbl-Tenant': 'Multi-tenancy root. Ogni istanza del gestionale è isolata da TenantId (GUID).',
  'tbl-Condominio': 'Entità centrale. Contiene i dati anagrafici, le configurazioni rate e i riferimenti al mandato.',
  'tbl-Indirizzo': 'Indirizzo fisico del condominio (1:1 con Condominio).',
  'tbl-DatiCatastali': 'Dati catastali del condominio (1:1 con Condominio).',
  'tbl-Unita': 'Ogni appartamento/garage/cantina. Identificato da Scala+Piano+Interno.',
  'tbl-Proprietario': 'Associa utenti (proprietari) alle unità. Supporta comproprietà e usufrutto.',
  'tbl-Inquilino': 'Inquilino fisico non necessariamente utente del sistema.',
  'tbl-TabellaMillesimale': 'Tabella millesimale (es: generale, riscaldamento). N per condominio.',
  'tbl-MillesimiUnita': 'Quota millesimale di ogni unità in ogni tabella. Join table.',
  'tbl-Fornitore': 'Anagrafica fornitori condivisa a livello Tenant.',
  'tbl-Contratto': 'Contratti tra condominio e fornitori.',
  'tbl-PianoDeiConti': 'Piano dei conti gerarchico (auto-referenziale) per contabilità.',
  'tbl-Bilancio': 'Bilancio preventivo o consuntivo annuale.',
  'tbl-VoceBilancio': 'Righe del bilancio collegate a conti contabili.',
  'tbl-Spesa': '⚡ BIGINT. Registro spese del condominio con ripartizione millesimale.',
  'tbl-Ripartizione': '⚡ BIGINT. Ripartizione della spesa per unità immobiliare.',
  'tbl-Rata': 'Rata condominiale periodica (mensile/trimestrale/ecc.).',
  'tbl-Quota': '⚡ BIGINT. Quota dovuta da ogni condomino per ogni rata.',
  'tbl-Incasso': '⚡ BIGINT. Registro pagamenti ricevuti dai condomini.',
  'tbl-Documento': 'Gestione documenti/allegati del condominio.',
  'tbl-Accesso': '⚡ BIGINT. Log accessi (visualizzazione/download) ai documenti.',
  'tbl-Comunicazione': 'Bacheca comunicazioni (avvisi, convocazioni, urgenti).',
  'tbl-Lettura': 'Traccia chi ha letto ogni comunicazione.',
  'tbl-Messaggio': '⚡ BIGINT. Messaggistica diretta tra utenti. Auto-referenziale per thread.',
};

document.querySelectorAll('.table-group').forEach(g => {
  g.addEventListener('mouseenter', e => {
    const d = desc[g.id];
    if (!d) return;
    const tt = document.getElementById('tooltip');
    tt.textContent = d;
    tt.style.display = 'block';
  });
  g.addEventListener('mousemove', e => {
    const tt = document.getElementById('tooltip');
    tt.style.left = (e.clientX + 14) + 'px';
    tt.style.top = (e.clientY + 14) + 'px';
  });
  g.addEventListener('mouseleave', () => {
    document.getElementById('tooltip').style.display = 'none';
  });
});
</script>
