<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #13161f; color: #e0e6f0; min-height: 100vh; }

  header {
    padding: 13px 22px;
    background: #0d0f1a;
    border-bottom: 2px solid #252d50;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  header h1 { font-size: 1.1rem; color: #7eb8f7; letter-spacing: 1px; }
  header .meta { font-size: 0.76rem; color: #6a7a9a; }

  .controls { display: flex; gap: 8px; align-items: center; }
  .controls button {
    background: #22274a; border: 1px solid #3d4570; color: #b0c4e8;
    border-radius: 5px; padding: 5px 12px; cursor: pointer; font-size: 0.8rem;
    transition: background 0.15s;
  }
  .controls button:hover { background: #2d3460; }

  .legend {
    display: flex; gap: 12px; flex-wrap: wrap; padding: 7px 20px;
    background: #0f1220; border-bottom: 1px solid #1e2340;
    align-items: center; font-size: 0.74rem; color: #aab8d0;
  }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .lc { width: 12px; height: 12px; border-radius: 2px; }

  #canvas-wrap {
    overflow: auto; width: 100%; height: calc(100vh - 104px);
    cursor: grab;
  }
  #canvas-wrap:active { cursor: grabbing; }
  svg { display: block; }

  /* Text styles */
  .tbl-name { font-weight: 700; font-size: 11.5px; fill: #fff; }
  .tbl-pk   { font-size: 9.5px; fill: #ffd166; font-weight: 700; }
  .tbl-fk   { font-size: 9.5px; fill: #74c7ec; }
  .tbl-col  { font-size: 9.5px; fill: #c8d6ef; }
  .tbl-type { font-size: 8.5px; fill: #6a7a9a; }
  .tbl-ck   { font-size: 8px; fill: #7a8a6a; font-style: italic; }
  .section-lbl { font-size: 10px; font-weight: 700; }

  /* Section header fills */
  .h-core     { fill: #162040; }
  .h-prop     { fill: #0f3020; }
  .h-mill     { fill: #151a38; }
  .h-supp     { fill: #182010; }
  .h-finance  { fill: #38180a; }
  .h-rate     { fill: #28200a; }
  .h-receipt  { fill: #200e08; }
  .h-doc      { fill: #282808; }
  .h-comm     { fill: #28103a; }
  .h-hangfire { fill: #1a1a28; }

  /* Section body fills */
  .b-core     { fill: #0a1428; }
  .b-prop     { fill: #081e12; }
  .b-mill     { fill: #0c1020; }
  .b-supp     { fill: #0c1408; }
  .b-finance  { fill: #200c05; }
  .b-rate     { fill: #181405; }
  .b-receipt  { fill: #140805; }
  .b-doc      { fill: #181808; }
  .b-comm     { fill: #180820; }
  .b-hangfire { fill: #101018; }

  /* Border colours */
  .brd-core     { stroke: #3a7fd4; }
  .brd-prop     { stroke: #2ab870; }
  .brd-mill     { stroke: #3a60c0; }
  .brd-supp     { stroke: #50b030; }
  .brd-finance  { stroke: #d06030; }
  .brd-rate     { stroke: #b09020; }
  .brd-receipt  { stroke: #c84820; }
  .brd-doc      { stroke: #b0b020; }
  .brd-comm     { stroke: #9030cc; }
  .brd-hangfire { stroke: #505060; }

  .tbl-border { stroke-width: 1.5; fill: none; }
  .row-sep { stroke: #202840; stroke-width: 0.6; }

  /* Relation lines */
  .rel { stroke: #384060; stroke-width: 1.1; fill: none; stroke-dasharray: 5,3; opacity: 0.8; }
  .rel-arrow { fill: #4a80b0; }
</style>
</head>

<script>
let scale = 1;
let isDragging = false;
let startX, startY, scrollLeft, scrollTop;
const wrap = document.getElementById('canvas-wrap');

wrap.addEventListener('mousedown', e => {
  isDragging = true;
  startX = e.pageX - wrap.offsetLeft;
  startY = e.pageY - wrap.offsetTop;
  scrollLeft = wrap.scrollLeft;
  scrollTop = wrap.scrollTop;
  wrap.style.cursor = 'grabbing';
});
wrap.addEventListener('mouseleave', () => { isDragging = false; wrap.style.cursor = 'grab'; });
wrap.addEventListener('mouseup', () => { isDragging = false; wrap.style.cursor = 'grab'; });
wrap.addEventListener('mousemove', e => {
  if (!isDragging) return;
  e.preventDefault();
  const x = e.pageX - wrap.offsetLeft;
  const y = e.pageY - wrap.offsetTop;
  wrap.scrollLeft = scrollLeft - (x - startX);
  wrap.scrollTop = scrollTop - (y - startY);
});

wrap.addEventListener('wheel', e => {
  e.preventDefault();
  scale = e.deltaY < 0 ? Math.min(scale * 1.12, 3) : Math.max(scale * 0.9, 0.25);
  const el = document.getElementById('diagram');
  el.style.transform = `scale(${scale})`;
  el.style.transformOrigin = 'top left';
}, { passive: false });

function resetZoom() {
  scale = 1;
  const el = document.getElementById('diagram');
  el.style.transform = '';
  wrap.scrollLeft = 0;
  wrap.scrollTop = 0;
}
function zoomIn() {
  scale = Math.min(scale * 1.2, 3);
  const el = document.getElementById('diagram');
  el.style.transform = `scale(${scale})`;
  el.style.transformOrigin = 'top left';
}
function zoomOut() {
  scale = Math.max(scale * 0.82, 0.25);
  const el = document.getElementById('diagram');
  el.style.transform = `scale(${scale})`;
  el.style.transformOrigin = 'top left';
}
</script>
